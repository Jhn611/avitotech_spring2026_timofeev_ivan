version: '3.8'

services:
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-dev
    ports:
      - "80:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules               
    environment:
      - NODE_ENV=development
    depends_on:
      - backend-dev

  backend-dev:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: backend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules                
    environment:
      - NODE_ENV=development
      - PORT=3000
    command: npx tsx watch server.ts

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped